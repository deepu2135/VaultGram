name: Build & Release VaultGram APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/VaultGram.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultGram-APK
          path: artifacts/VaultGram.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.9
          name: VaultGram Release v2.0.9
          body: |
            ## 🚀 VaultGram Release v2.0.9
            
            ### 📱 Download Installable APK:
            - **VaultGram.apk**: Standalone Android App signed with official persistent release key.
            - Auto-migration & safeguarding for SQLite `settings` table.
            - Reliable Settings modal opening & input saving.
            - Native Android Photo/File Picker.
            - Embedded Zero-Knowledge AES-256 Cloud Engine.
          files: artifacts/VaultGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
