name: Build & Release VaultGram APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/VaultGram.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultGram-APK
          path: artifacts/VaultGram.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: VaultGram Release v1.0.2
          body: |
            ## 🚀 VaultGram Release v1.0.2
            
            ### 📱 Download Installable APK:
            - **VaultGram.apk**: Android App for Zero-Knowledge Telegram Storage.
            - Client-Side AES-256-GCM Encryption.
            - Instant Background Cloud Backup.
            - Chitralaya Material 3 Gallery Interface.
          files: artifacts/VaultGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
