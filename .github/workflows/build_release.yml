name: Build & Release VaultGram APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.1.7-build.${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/VaultGram.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultGram-APK
          path: artifacts/VaultGram.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VaultGram Release ${{ steps.version.outputs.tag }}
          body: |
            ## 🚀 VaultGram Release ${{ steps.version.outputs.tag }}
            
            ### 📱 Download Installable APK:
            - **VaultGram.apk**: Standalone Android App signed with official persistent release key.
            - Fixed Kotlin null safety build errors in VaultServer.kt.
            - Fixed folder type mismatch (`directory` → `folder`).
            - Added path traversal protection for static file serving.
            - Fixed encrypted bytes leakage on decryption failure.
            - Embedded Zero-Knowledge AES-256 Cloud Engine.
          files: artifacts/VaultGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
