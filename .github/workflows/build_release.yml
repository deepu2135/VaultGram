name: Build & Release VaultGram APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew || true

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Copy Release APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/VaultGram.apk || cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/VaultGram.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultGram-APK
          path: artifacts/VaultGram.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VaultGram Release ${{ github.ref_name }}
          body: |
            ## 🚀 VaultGram Release
            
            ### 📱 What's Included:
            - **VaultGram.apk**: Android App for Zero-Knowledge Telegram Storage.
            - Client-Side AES-256-GCM Encryption.
            - Instant Background Cloud Backup.
            - Chitralaya Material 3 Gallery Interface.
          files: artifacts/VaultGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
